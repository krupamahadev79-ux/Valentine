<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Valentine ❤</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 { font-size: 2.2rem; margin-bottom: 10px; }
    h2 { font-size: 1.3rem; margin-bottom: 20px; font-weight: 400; }
    p { font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }
    .heart { font-size: 3rem; animation: beat 1s infinite; margin: 15px 0; }
    @keyframes beat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }
    button {
      background:#ff4d6d;border:none;color:#fff;padding:12px 25px;
      font-size:1rem;border-radius:30px;cursor:pointer;margin:5px;
    }
    .hidden { display:none; margin-top:20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Happy Valentine's Day ❤</h1>
    <h2>My Love, Divyanshi</h2>
    <div class="heart">💖</div>

    <img src="couple.jpg" alt="Us Together" style="width:100%;border-radius:15px;margin:15px 0;" />

    <p>
      From the moment you came into my life, everything became brighter.
      You are my smile, my peace, and my forever.
    </p>

    <button onclick="showMessage()">Click for a Surprise</button>

    <p class="hidden" id="surprise">
      I promise to love you today, tomorrow, and always.
      Will you be my Valentine? 🌹
    </p>

    <div class="hidden" id="proposal">
      <h2>Will you be mine forever? 💍</h2>
      <button onclick="yesClicked()">Yes 💖</button>
      <button onclick="alwaysClicked()">Always ♾️</button>
    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="https://pagalfree.com/musics/128-Raatan%20Lambiyan%20-%20Shershaah%20128%20Kbps.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showMessage() {
      document.getElementById('surprise').style.display='block';
      document.getElementById('proposal').style.display='block';
      document.getElementById('bgMusic').play();
    }

    function yesClicked() {
      alert('You just made me the happiest person alive 💕');
    }

    function alwaysClicked() {
      document.body.innerHTML = `
        <style>
          .final-screen{
            min-height:100vh;display:flex;align-items:center;justify-content:center;
            background:linear-gradient(135deg,#ff758c,#ff7eb3);
            overflow:hidden;position:relative;
          }
          .glow{
            font-size:2.7rem;text-align:center;color:#fff;
            text-shadow:0 0 10px #fff,0 0 20px #ffb3c6,0 0 30px #ff4d6d;
            z-index:2;padding:20px;
          }
          .heart-float{
            position:absolute;bottom:-50px;font-size:24px;
            animation: floatUp linear infinite;opacity:0.8;
          }
          @keyframes floatUp{
            from{transform:translateY(0) scale(1);opacity:1;}
            to{transform:translateY(-120vh) scale(1.5);opacity:0;}
          }
        </style>
        <div class="final-screen">
          <h1 class="glow">Divyanshi, you chose Always…<br/>and I’ll choose you forever ❤️</h1>
        </div>
      `;

      for(let i=0;i<20;i++){
        const heart=document.createElement('div');
        heart.className='heart-float';
        heart.innerText='💖';
        heart.style.left=Math.random()*100+'vw';
        heart.style.animationDuration=5+Math.random()*5+'s';
        document.body.appendChild(heart);
      }
    }
  </script>
</body>
</html>
